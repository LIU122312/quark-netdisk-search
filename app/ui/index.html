<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夸克资源检索</title>
<style>
  /* ===================== 主题变量 ===================== */
  :root {
    color-scheme: dark;
    --bg:#0c0f13; --bg2:#11151b; --panel:#161b22; --panel2:#1c222b;
    --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
    --fg:#e7ecf3; --fg2:#9aa7b8; --fg3:#6b7787;
    --acc:#4c8dff; --acc2:#79aeff; --ok:#48cf7d; --bad:#ff7b72; --warn:#ffd166;
    --r:14px; --r2:10px;
  }
  * { box-sizing:border-box; }
  html { scrollbar-color:#2b333f transparent; }
  body {
    margin:0; min-height:100vh;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 15% -10%,rgba(76,141,255,.10),transparent 60%),var(--bg);
    color:var(--fg); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  body.rank-open { overflow:hidden; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2b333f; border-radius:8px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:#3b4655; background-clip:content-box; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 22px; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  /* ===================== 顶栏 ===================== */
  header { position:sticky; top:0; z-index:20; padding:14px 0 12px;
    background:rgba(12,15,19,.82); backdrop-filter:blur(14px) saturate(1.3); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .logo { width:30px; height:30px; flex:0 0 30px; border-radius:9px; display:grid; place-items:center;
    font-size:15px; font-weight:800; color:#fff; background:linear-gradient(140deg,#5b95ff,#3a6ff0 55%,#7b5bff);
    box-shadow:0 4px 14px rgba(76,141,255,.35); }
  h1 { margin:0; font-size:17px; font-weight:650; letter-spacing:.3px; }
  .btag { color:var(--fg3); font-size:12.5px; padding-left:2px; }
  .src { margin-left:auto; font-style:normal; font-size:12px; color:var(--fg3);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px; white-space:nowrap; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sbox { position:relative; flex:1 1 340px; min-width:200px; }
  .sbox .ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px;
    fill:none; stroke:var(--fg3); stroke-width:2; stroke-linecap:round; pointer-events:none; }
  input[type=text] { width:100%; background:var(--panel); border:1px solid var(--line2); color:var(--fg);
    border-radius:var(--r2); padding:11px 13px; font-size:14px; outline:none; transition:border-color .15s,box-shadow .15s; }
  .sbox input { padding-left:38px; }
  input[type=text]::placeholder { color:#5d6875; }
  input[type=text]:focus { border-color:rgba(76,141,255,.7); box-shadow:0 0 0 3px rgba(76,141,255,.16); }
  button { background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:var(--r2);
    padding:11px 16px; font-size:13.5px; font-family:inherit; cursor:pointer; white-space:nowrap;
    transition:background .15s,border-color .15s,transform .08s,color .15s; }
  button:hover { background:#232b35; border-color:var(--line2); }
  button:active { transform:translateY(1px); }
  button.primary { background:linear-gradient(180deg,#5b95ff,#3d78ee); border-color:transparent; color:#fff; font-weight:600;
    box-shadow:0 6px 18px rgba(61,120,238,.32); padding:11px 22px; }
  button.primary:hover { background:linear-gradient(180deg,#6aa0ff,#4a83f5); }
  button.accent { color:var(--acc2); border-color:rgba(76,141,255,.35); background:rgba(76,141,255,.10); }
  button.accent:hover { background:rgba(76,141,255,.18); }
  button.small { padding:6px 11px; font-size:12.5px; border-radius:8px; }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  .caret { margin-left:5px; font-size:10px; opacity:.8; }
  #optToggle.on { color:#cfe0ff; border-color:rgba(76,141,255,.45); background:rgba(76,141,255,.14); }
  #optToggle.on .caret { transform:rotate(180deg); display:inline-block; }

  /* ===================== 筛选项 ===================== */
  .opts { margin-top:12px; padding:12px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r2); display:flex; flex-direction:column; gap:9px; }
  .opts[hidden] { display:none; }
  .ogroup { display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap; }
  .olabel { flex:0 0 40px; color:var(--fg3); font-size:12px; }
  .opts label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    color:var(--fg2); font-size:13px; padding:4px 2px; }
  .opts label:hover { color:var(--fg); }
  .opts b { color:var(--acc2); font-weight:600; }
  input[type=checkbox] { appearance:none; width:15px; height:15px; flex:0 0 15px; border-radius:4px;
    border:1.5px solid #3c4756; background:#0f1319; cursor:pointer; position:relative; transition:all .15s; }
  input[type=checkbox]:hover { border-color:#56637a; }
  input[type=checkbox]:checked { background:var(--acc); border-color:var(--acc); }
  input[type=checkbox]:checked::after { content:""; position:absolute; left:4.5px; top:1.5px; width:4px; height:8px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg); }
  .bar { height:2px; background:transparent; margin-top:10px; overflow:hidden; border-radius:2px; display:none; }
  .bar.on { display:block; }
  .bar > i { display:block; height:100%; width:0; border-radius:2px;
    background:linear-gradient(90deg,var(--acc),#7b5bff); transition:width .25s; }

  /* ===================== 结果区 ===================== */
  main { padding-bottom:80px; }
  .toolbar { display:flex; align-items:flex-start; gap:14px; margin:18px 0 14px; flex-wrap:wrap; }
  .meta { flex:1 1 420px; color:var(--fg2); font-size:12.5px; line-height:1.85; min-width:260px; }
  .meta b { color:var(--fg); }
  .qbox { position:relative; flex:0 1 300px; min-width:200px; }
  .qbox .ico { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px;
    fill:none; stroke:var(--fg3); stroke-width:2; stroke-linecap:round; pointer-events:none; }
  .qbox input { padding:8px 11px 8px 32px; font-size:13px; }
  .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:12px; }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; display:flex; flex-direction:column; gap:10px; transition:border-color .15s,transform .12s,box-shadow .15s; }
  .card:hover { border-color:var(--line2); transform:translateY(-1px); box-shadow:0 10px 26px rgba(0,0,0,.28); }
  .card.local { border-left:3px solid #3cae6c; }
  .card.dead { opacity:.45; }
  .card.dead .title { text-decoration:line-through; }
  .title { font-size:14.5px; line-height:1.55; word-break:break-word; font-weight:500; }
  .sub { display:flex; gap:7px; flex-wrap:wrap; align-items:center; color:var(--fg3); font-size:12px; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:auto; }
  .link { flex:1 1 120px; min-width:0; color:var(--acc2); text-decoration:none; font-size:12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link:hover { text-decoration:underline; }
  .actions button { padding:6px 12px; font-size:12.5px; border-radius:8px; }
  .badge { background:rgba(76,141,255,.14); color:#a9c8ff; border-radius:999px; padding:2.5px 9px; font-size:11.5px; white-space:nowrap; }
  .badge.lib { background:rgba(72,207,125,.14); color:#8ee0ab; }
  .badge.ar { background:rgba(255,209,102,.13); color:#e6c877; }
  .badge.v-ok { background:rgba(72,207,125,.16); color:#6ee08a; }
  .badge.v-dead { background:rgba(255,123,114,.15); color:#ff9b93; }
  .badge.v-wait { background:rgba(255,255,255,.07); color:var(--fg3); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .empty { grid-column:1/-1; color:var(--fg2); padding:56px 0; text-align:center; font-size:13.5px; }
  /* ===================== 欢迎空态 ===================== */
  .welcome { grid-column:1/-1; text-align:center; padding:36px 10px 32px;
    min-height:calc(100vh - 310px); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .wico { font-size:30px; opacity:.6; margin-bottom:16px; }
  .wt { font-size:14px; color:var(--fg2); margin-bottom:20px; }
  .whints { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
  .hint { display:inline-flex; align-items:baseline; gap:7px; background:var(--panel); border:1px solid var(--line);
    color:var(--fg); border-radius:999px; padding:9px 16px; font-size:13.5px; }
  .hint i { font-style:normal; font-size:11px; color:var(--fg3); }
  .wt2 { font-size:12px; color:var(--fg3); margin:0 0 10px; letter-spacing:.4px; }
  .wgo { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }
  .wgo .hint { padding:7px 14px; font-size:12.5px; color:var(--fg2); }
  .wgo .hint:hover { color:#cfe0ff; }
  .wkeys { font-size:12px; color:var(--fg3); line-height:2; }
  kbd { font-family:inherit; background:var(--panel2); border:1px solid var(--line2); border-bottom-width:2px;
    border-radius:5px; padding:1px 6px; font-size:11.5px; color:var(--fg2); }

  /* ===================== 排行榜浮层 ===================== */
  #rank { position:fixed; inset:0; z-index:50; overflow:auto; padding:26px 22px 40px;
    background:rgba(6,8,11,.74); backdrop-filter:blur(8px); }
  #rank[hidden] { display:none; }
  #rank .sheet { max-width:1180px; margin:0 auto; background:var(--bg2); border:1px solid var(--line2);
    border-radius:18px; padding:18px 22px 24px; box-shadow:0 30px 70px rgba(0,0,0,.55); }
  .sheet-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .rank-head { flex:1; min-width:0; }
  .rank-boards { display:flex; gap:7px; flex-wrap:wrap; }
  .rgroup { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .glabel { flex:0 0 56px; text-align:right; color:var(--fg3); font-size:11.5px; padding-top:6px; }
  .gchips { display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0; }
  .rank-info { color:var(--fg2); font-size:12.5px; margin:12px 0 14px; padding-top:12px; border-top:1px solid var(--line); }
  .rank-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:16px 14px; }
  .rcard { background:var(--panel); border:1px solid var(--line); border-radius:var(--r2); padding:8px;
    display:flex; flex-direction:column; transition:border-color .15s,transform .12s,box-shadow .15s; }
  .rcard:hover { border-color:var(--line2); transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.35); }
  .rposter { position:relative; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:#0f1319; cursor:pointer; }
  .rposter img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s; }
  .rcard:hover .rposter img { transform:scale(1.04); }
  .rnoimg { display:grid; place-items:center; height:100%; color:#55606e; font-size:12px; }
  .rrank { position:absolute; top:6px; left:6px; background:rgba(10,12,16,.82); backdrop-filter:blur(4px);
    color:var(--warn); font-size:12px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .rscore { position:absolute; bottom:6px; right:6px; background:rgba(10,12,16,.82); backdrop-filter:blur(4px);
    color:#8ee0ab; font-size:12px; font-weight:600; padding:2px 7px; border-radius:6px; }
  .rtitle { font-size:12.5px; line-height:1.45; margin:9px 0 3px; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .rsub { font-size:11.5px; color:var(--fg3); margin-bottom:9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .racts { display:flex; gap:6px; align-items:center; margin-top:auto; }
  .racts button { padding:5px 10px; font-size:11.5px; border-radius:7px; }
  .racts a { color:var(--acc2); font-size:11.5px; text-decoration:none; margin-left:auto; white-space:nowrap; }
  .racts a:hover { text-decoration:underline; }
  .sheet-foot { display:flex; justify-content:center; margin-top:22px; }
  .chip { background:var(--panel2); border:1px solid var(--line); color:var(--fg2); border-radius:999px;
    padding:7px 16px; font-size:13px; cursor:pointer; transition:all .15s; }
  .chip:hover { color:var(--fg); border-color:var(--line2); background:#232b35; }
  .chip.on { background:linear-gradient(180deg,#5b95ff,#3d78ee); border-color:transparent; color:#fff; font-weight:600;
    box-shadow:0 6px 16px rgba(61,120,238,.3); }
  .chip.sm { padding:5px 12px; font-size:12.5px; background:#1a1f27; }
  .chip.sm.on { background:rgba(76,141,255,.20); border-color:rgba(76,141,255,.5); color:#bcd5ff; font-weight:500; box-shadow:none; }
  .chip.clr { background:rgba(255,123,114,.13); border-color:rgba(255,123,114,.35); color:#ffb4ad; }

  @media (max-width:820px) {
    .wrap { padding:0 14px; }
    .list { grid-template-columns:1fr; }
    .btag { display:none; }
    .src { display:none; }
    .olabel { flex:0 0 100%; }
    #rank { padding:10px; }
    #rank .sheet { border-radius:14px; padding:14px; }
    .glabel { flex:0 0 46px; }
    .welcome { min-height:auto; padding-top:22px; }
    .bar { margin-top:8px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <span class="logo">夸</span>
      <h1>夸克资源检索</h1>
      <span class="btag">本地精选库 + PanSou ・ 只留夸克链接</span>
      <i class="src" id="src">源状态加载中...</i>
    </div>
    <div class="row">
      <div class="sbox">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <input type="text" id="kw" placeholder="搜片名 / 剧名 / 游戏 / 书名，回车搜索（例：庆余年、双人成行、三体）" autofocus>
      </div>
      <button id="go" class="primary">搜索</button>
      <button id="clear">清空</button>
      <button id="rankBtn" class="accent">排行榜</button>
      <button id="optToggle" aria-expanded="false">筛选<span class="caret">▾</span></button>
    </div>
    <div class="opts" id="optsBox" hidden>
      <div class="ogroup">
        <span class="olabel">范围</span>
        <label><input type="checkbox" id="onlyLocal"> 只看本地精选 <b id="nLocal"></b></label>
        <label><input type="checkbox" id="onlyHeji"> 只看合集 / 全集</label>
        <label><input type="checkbox" id="exPreview"> 去掉小说 / 漫画 / 软件 / 预告</label>
        <label><input type="checkbox" id="ex4k"> 只要 4K</label>
      </div>
      <div class="ogroup">
        <span class="olabel">入库</span>
        <label><input type="checkbox" id="incSd"> 含短剧</label>
        <label><input type="checkbox" id="incAr" checked> 含历史归档</label>
        <label><input type="checkbox" id="incAll"> 含阿里 / 百度</label>
      </div>
      <div class="ogroup">
        <span class="olabel">链接</span>
        <label><input type="checkbox" id="useQuark" checked> 用夸克客户端打开</label>
        <label><input type="checkbox" id="autoCheck" checked> 自动校验链接</label>
        <label><input type="checkbox" id="onlyValid"> 仅显示有效</label>
        <button id="checkAll" class="small">校验全部</button>
      </div>
    </div>
    <div class="bar" id="bar"><i id="pbar"></i></div>
  </div>
</header>
<main class="wrap">
  <div class="toolbar">
    <div class="meta" id="meta">输入片名开始搜索。结果 = 本地精选库（人工整理、每日更新）+ 在线 PanSou（TG 频道与插件并发）。</div>
    <div class="qbox">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"></path></svg>
      <input type="text" id="quick" placeholder="结果内筛选：杜比 / 国配 / 1080P">
    </div>
  </div>
  <div id="list" class="list"></div>
  <section id="rank" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <div class="rank-head"><div class="rank-boards" id="rankCats"></div></div>
        <button id="rankClose" class="small">关闭</button>
      </div>
      <div id="rankBoards"></div>
      <div class="rank-info" id="rankInfo">正在加载榜单...</div>
      <div class="rank-grid" id="rankGrid"></div>
      <div class="sheet-foot"><button id="rankMore" class="small">加载更多</button></div>
    </div>
  </section>
</main>
<script>

const $ = (id) => document.getElementById(id);
const HEJI = /合集|全集|全季|合辑|系列/;
const JUNK = /\.txt|\.mobi|\.epub|\.pdf|小说|电子书|有声|广播剧|漫画|模拟器|软件|apk|安装包|全本|TXT全文|TXT下载|预告|花絮|解说|ost|原声|主题曲/i;
const PROV = { quark:'夸克', ali:'阿里', baidu:'百度', '115':'115', tianyi:'天翼', '123':'123', pikpak:'PikPak', other:'网盘' };
const PREFS = { onlyLocal:0, onlyHeji:0, exPreview:1, ex4k:0, incSd:0, incAr:1, incAll:0, useQuark:1, autoCheck:1, onlyValid:0 };

let rows = [];
let vmap = {};
let cardEls = [];
let seq = 0;
let busyGen = -1;

function isShortDrama(s) {
  s = String(s || '');
  if (/短剧/.test(s)) return true;
  if (/有声小说|有声书|广播剧|听书|评书|相声|纪录片|公开课|讲座|课程|儿歌/.test(s)) return false;
  const m = s.match(/[（(]\s*(?:全|共)?\s*(\d{2,4})\s*集/);
  return !!(m && parseInt(m[1], 10) >= 50);
}

/* 在线结果相关性打分：标题越贴近关键词越靠前，长标题与噪音标题沉底 */
function onlineScore(note, kw) {
  const t = String(note || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const k = String(kw || '').trim().toLowerCase();
  if (!k) return 0;
  let s;
  if (t === k) s = 1000;
  else if (t.indexOf(k) === 0) s = 800;
  else if (t.indexOf(k) >= 0) s = 460;
  else s = 140;
  s -= Math.min(Math.max(t.length - k.length, 0), 26) * 5;
  if (/4k|2160p|蓝光|remux/i.test(t)) s += 45;
  if (/合集|全集|完结|全\d+集/.test(t)) s += 30;
  if (/豆瓣[789]\.\d/.test(t)) s += 25;
  return s;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function ts(s) { const d = new Date(s || 0); return isNaN(d) ? 0 : d.getTime(); }
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function loadPrefs() { for (const k in PREFS) { const v = localStorage.getItem('qs3_' + k); $(k).checked = v === null ? !!PREFS[k] : v === '1'; } }
function savePrefs() { for (const k in PREFS) localStorage.setItem('qs3_' + k, $(k).checked ? '1' : '0'); }

function cardHtml(r) {
  const dead = vmap[r.url] === 0;
  const b = [];
  b.push('<span class="badge">' + escapeHtml(PROV[r.prov] || '网盘') + '</span>');
  b.push(r.local ? '<span class="badge lib">本地精选</span>' : '<span class="badge">在线</span>');
  if (r.ar) b.push('<span class="badge ar">历史归档</span>');
  if (r.sd) b.push('<span class="badge ar">短剧</span>');
  b.push('<span class="badge v-wait v"></span>');
  return '<div class="card' + (r.local ? ' local' : '') + (dead ? ' dead' : '') + '">' +
    '<div class="title">' + escapeHtml(r.note || '(无标题)') + '</div>' +
    '<div class="sub">' + b.join('') +
      (r.source ? '<span>' + escapeHtml(r.source) + '</span>' : '') +
      (r.datetime ? '<span>' + fmtDate(r.datetime) + '</span>' : '') +
      (r.password ? '<span>提取码 ' + escapeHtml(r.password) + '</span>' : '') +
    '</div>' +
    '<div class="actions">' +
      '<a class="link" href="' + escapeHtml(r.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(r.url) + '</a>' +
      '<button data-copy="' + escapeHtml(r.url) + '">复制链接</button>' +
      '<button class="ghost" data-open="' + escapeHtml(r.url) + '">打开并转存</button>' +
    '</div>' +
  '</div>';
}

function paint(c) {
  const v = vmap[c.url];
  if (v === 1) { c.vEl.className = 'badge v-ok v'; c.vEl.textContent = '有效'; }
  else if (v === 0) { c.vEl.className = 'badge v-dead v'; c.vEl.textContent = '已失效'; }
  else if (v === -1) { c.vEl.className = 'badge v-wait v'; c.vEl.textContent = '需提取码/未校验'; }
  else { c.vEl.className = 'badge v-wait v'; c.vEl.textContent = '未校验'; }
  c.el.classList.toggle('dead', v === 0);
}

function render() {
  const q = $('quick').value.trim().toLowerCase();
  const incSd = $('incSd').checked;
  const onlyValid = $('onlyValid').checked;
  let view = [];
  for (const r of rows) {
    const t = (r.note || '').toLowerCase();
    if (q && t.indexOf(q) < 0) continue;
    if (!incSd && r.sd) continue;
    if ($('onlyHeji').checked && !HEJI.test(r.note || '')) continue;
    if ($('exPreview').checked && JUNK.test(r.note || '')) continue;
    if ($('ex4k').checked && !/4k/i.test(r.note || '')) continue;
    if ($('onlyLocal').checked && !r.local) continue;
    if (onlyValid && vmap[r.url] === 0) continue;
    view.push(r);
  }
  const idx = view.map((r, i) => [r, i]);
  idx.sort((a, b) => ((vmap[a[0].url] === 0 ? 1 : 0) - (vmap[b[0].url] === 0 ? 1 : 0)) || (a[1] - b[1]));
  view = idx.map(x => x[0]);

  cardEls = [];
  const list = $('list');
  list.innerHTML = view.length ? view.map(cardHtml).join('') : '<div class="empty">没有匹配结果。</div>';
  if (view.length) {
    const els = list.querySelectorAll('.card');
    for (let i = 0; i < els.length; i++) cardEls.push({ url: view[i].url, el: els[i], vEl: els[i].querySelector('.v') });
    cardEls.forEach(paint);
  }
  updateMeta(view.length);
}

function updateMeta(shown) {
  const localN = rows.filter(r => r.local).length;
  const okN = rows.filter(r => vmap[r.url] === 1).length;
  const deadN = rows.filter(r => vmap[r.url] === 0).length;
  const waitN = rows.filter(r => vmap[r.url] === -1).length;
  let h = '共 <b>' + rows.length + '</b> 条（本地精选 <b>' + localN + '</b> ・ 在线 <b>' + (rows.length - localN) + '</b>）';
  if (shown !== null && shown !== undefined && shown !== rows.length) h += '，当前显示 <b>' + shown + '</b> 条';
  h += '<br>链接校验（本机直连夸克接口实测）：' + ((okN + deadN + waitN) === 0
    ? '尚未开始' : '<span class="ok">有效 ' + okN + '</span> ・ <span class="bad">已失效 ' + deadN + '</span> ・ 未校验 ' + waitN);
  h += '<br>转存：点「打开并转存」→ 直接在夸克客户端里点「保存到我的网盘」';
  $('meta').innerHTML = h;
}

async function verify(all) {
  const my = seq;
  if (busyGen === my) return;
  const localN = rows.filter(r => r.local).length;
  const ordered = rows.filter(r => r.local).concat(rows.filter(r => !r.local));
  const cap = all ? ordered.length : Math.min(ordered.length, localN + 120);
  const need = [];
  const seen = {};
  for (let i = 0; i < cap; i++) {
    const r = ordered[i];
    if (vmap[r.url] !== undefined || seen[r.url]) continue;
    if (r.prov !== 'quark') { vmap[r.url] = -2; continue; }
    seen[r.url] = 1;
    need.push(r.url);
  }
  cardEls.forEach(paint);
  if (!need.length) return;
  busyGen = my;
  $('bar').classList.add('on');
  const BATCH = 40;
  let done = 0;
  try {
    for (let i = 0; i < need.length; i += BATCH) {
      if (my !== seq) return;
      const chunk = need.slice(i, i + BATCH);
      let res = {};
      try {
        const r = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ urls: chunk }) }).then(x => x.json());
        res = (r && r.results) || {};
      } catch (e) { res = {}; }
      for (const u of chunk) vmap[u] = (res[u] === undefined ? -1 : res[u]);
      done += chunk.length;
      $('pbar').style.width = Math.round(done * 100 / need.length) + '%';
      cardEls.forEach(paint);
      updateMeta(null);
    }
  } finally {
    if (busyGen === my) busyGen = -1;
    if (my === seq) { $('bar').classList.remove('on'); $('pbar').style.width = '0%'; render(); }
  }
}

async function openLink(url, btn) {
  const mode = $('useQuark').checked ? 'quark' : 'browser';
  const old = btn.textContent;
  btn.disabled = true;
  let r = null;
  try {
    r = await fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, mode }) }).then(x => x.json());
  } catch (e) { r = null; }
  if (r && r.ok) {
    btn.textContent = r.via === 'quark' ? '已交给夸克客户端' : (r.note || '已用默认浏览器打开');
  } else {
    btn.textContent = (r && r.error) ? '打开失败：' + r.error : '打开失败';
  }
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1800);
}

async function loadSrc() {
  try {
    const r = await Promise.all([
      fetch('/api/health').then(x => x.json()).catch(() => ({})),
      fetch('/api/library?kw=&limit=1').then(x => x.json()).catch(() => ({})),
    ]);
    const h = r[0] || {}, l = r[1] || {}, tg = h.tg || {};
    $('src').innerHTML = '本地库 ' + (l.indexed || 0).toLocaleString() + ' 条 ・ 插件 ' + (h.plugin_count || 0) +
      ' ・ 频道 ' + (h.channels_count || 0) + ' ・ TG ' + (tg.reachable ? '<span class="ok">可用</span>' : '<span class="bad">不可用</span>');
  } catch (e) { $('src').textContent = '源状态不可用'; }
}

async function search() {
  const kw = $('kw').value.trim();
  if (!kw) return;
  const my = ++seq;
  const btn = $('go'); btn.disabled = true; btn.textContent = '搜索中...';
  rows = []; vmap = {}; cardEls = []; busyGen = -1; $('bar').classList.remove('on');
  $('list').innerHTML = '';
  $('meta').textContent = '正在搜索（本地精选库 + TG 频道 + 插件）...';
  const t0 = Date.now();
  const enc = encodeURIComponent(kw);
  const libUrl = '/api/library?kw=' + enc + '&limit=800&sc=' + ($('incSd').checked ? 1 : 0) +
    '&ar=' + ($('incAr').checked ? 1 : 0) + ($('incAll').checked ? '&all=1' : '');
  try {
    const res = await Promise.all([
      fetch('/api/search?kw=' + enc + '&cloud_types=quark').then(x => x.json()).catch(() => null),
      fetch(libUrl).then(x => x.json()).catch(() => null),
    ]);
    if (my !== seq) return;
    const pansou = res[0], lib = res[1];
    const online = ((pansou && pansou.data || {}).merged_by_type || {}).quark || [];
    const localAll = (lib && lib.items) || [];
    const hid = (lib && lib.hidden) || { sd: 0, ar: 0, prov: 0 };
    const seen = {};
    online.forEach(x => { seen[x.url] = 1; });
    const localRows = localAll.filter(x => !seen[x.u]).map(x => ({
      url: x.u, note: x.n, source: '精选库·' + x.c, datetime: x.d, password: '',
      local: true, prov: x.p, ar: x.ar, sd: x.sd,
    }));
    const onlineRows = online.map(x => ({
      url: x.url, note: x.note, source: x.source, datetime: x.datetime, password: x.password,
      local: false, prov: 'quark', ar: 0, sd: isShortDrama(x.note) ? 1 : 0,
      rel: onlineScore(x.note, kw),
    })).sort((a, b) => (b.rel - a.rel) || (ts(b.datetime) - ts(a.datetime)));
    rows = localRows.concat(onlineRows);
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    if (!rows.length) {
      $('meta').innerHTML = '没有结果（用时 ' + elapsed + 's）。换个片名，或勾上「含短剧 / 含历史归档 / 含阿里百度」扩大范围。';
      return 0;
    }
    render();
    $('meta').innerHTML = '共 <b>' + rows.length + '</b> 条 ・ 用时 ' + elapsed + 's' +
      '<br>本地精选 <b>' + localRows.length + '</b> 条 ・ 在线 <b>' + onlineRows.length + '</b> 条' +
      (function () {
        const en = (pansou && pansou.data || {}).enhanced;
        if (!en) return '';
        const bits = [];
        if (en.variants && en.variants.length) bits.push('近似词 <b>' + en.variants.map(escapeHtml).join(' / ') + '</b>');
        if (en.extras && en.extras.length) bits.push('在线源 ' + en.extras.map(escapeHtml).join(' '));
        return bits.length ? '<br>' + bits.join(' ・ ') : '';
      })() +
      '<br>已排除：短剧 ' + hid.sd + ' 条、历史归档 ' + hid.ar + ' 条、非夸克网盘 ' + hid.prov + ' 条（可勾选放回）' +
      (onlineRows.length < 30 ? '<br><span class="bad">在线偏少</span>：多半是 TG 源没走通，换个能过 Telegram 的 Clash 节点会变多' : '');
    loadSrc();
    if ($('autoCheck').checked) verify(false);
    return rows.length;
  } catch (e) {
    $('meta').innerHTML = '<span class="bad">搜索失败：' + escapeHtml(e.message) + '（确认 PanSou 服务已启动）</span>';
    return 0;
  } finally { btn.disabled = false; btn.textContent = '搜索'; }
}

document.addEventListener('click', (e) => {
  const t = e.target;
  const f1 = t.closest && t.closest("[data-fsrc]");
  if (f1) { const s0 = curSel(); s0.src = f1.getAttribute("data-fsrc"); s0.regions = []; s0.genres = []; rankTabs(); rankReload(); return; }
  const f2 = t.closest && t.closest("[data-fregion]");
  if (f2) { tog(curSel().regions, f2.getAttribute("data-fregion")); rankTabs(); rankReload(); return; }
  const f3 = t.closest && t.closest("[data-fgenre]");
  if (f3) { tog(curSel().genres, f3.getAttribute("data-fgenre")); rankTabs(); rankReload(); return; }
  if (t.closest && t.closest("[data-fclear]")) { const s0 = curSel(); s0.regions = []; s0.genres = []; rankTabs(); rankReload(); return; }
  const rc = t.closest && t.closest("[data-rsearch]");
  if (rc) { rankSearch(rc.getAttribute("data-rsearch")); return; }
  const rcat = t.closest && t.closest("[data-rcat]");
  if (rcat) { RANK.cat = rcat.getAttribute("data-rcat"); RANK.board = ""; RANK.page = 1; RANK.n = 0; rankTabs(); loadRank(false); return; }
  const rb = t.closest && t.closest("[data-rboard]");
  if (rb) { RANK.board = rb.getAttribute("data-rboard"); RANK.page = 1; RANK.n = 0; rankTabs(); loadRank(false); return; }
  if (t.dataset && t.dataset.copy) { navigator.clipboard.writeText(t.dataset.copy).then(() => { t.textContent = '已复制'; setTimeout(() => t.textContent = '复制链接', 1200); }); }
  if (t.dataset && t.dataset.open) { openLink(t.dataset.open, t); }
});

$('go').onclick = search;
$('clear').onclick = () => { $('kw').value = ''; $('quick').value = ''; rows = []; cardEls = []; vmap = {}; $('list').innerHTML = ''; $('meta').textContent = '已清空。'; };
$('kw').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
['onlyLocal', 'onlyHeji', 'exPreview', 'ex4k', 'incSd', 'onlyValid'].forEach(id => $(id).addEventListener('change', () => { savePrefs(); if (rows.length) render(); }));
['incAr', 'incAll'].forEach(id => $(id).addEventListener('change', () => { savePrefs(); if (rows.length) search(); }));
$('autoCheck').addEventListener('change', () => { savePrefs(); if ($('autoCheck').checked && rows.length) verify(false); });

/* ===================== 排行榜（Bangumi 动画 + 豆瓣 电影/剧集） ===================== */
const RANK = { cat: "anime", board: "", page: 1, hasMore: false, cats: null, n: 0, gen: 0, sel: {} };
function curSel() {
  if (!RANK.sel[RANK.cat]) RANK.sel[RANK.cat] = { src: "", regions: [], genres: [] };
  return RANK.sel[RANK.cat];
}
let rankTimer = null;
const RANK_CATS = [["anime", "动漫"], ["movie", "电影"], ["tv", "剧集"], ["webfiction", "网文"], ["litfic", "传统文学"], ["comic", "漫画"], ["game", "游戏"], ["music", "音乐"]];

async function loadRankCats() {
  if (RANK.cats) return RANK.cats;
  const r = await fetch("/api/rank/cats").then(x => x.json()).catch(() => null);
  RANK.cats = (r && r.cats) || {};
  return RANK.cats;
}

function chipBtn(attr, val, label, on, title) {
  return '<button class="chip sm' + (on ? " on" : "") + '" ' + attr + '="' + escapeHtml(val) + '"' +
    (title ? ' title="' + escapeHtml(title) + '"' : "") + ">" + escapeHtml(label) + "</button>";
}

function rankReload() {
  if (rankTimer) clearTimeout(rankTimer);
  rankTimer = setTimeout(function () { rankTimer = null; loadRank(false); }, 300);
}

function tog(arr, v) { const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); }

function boardsHtml(boards) {
  const groups = [];
  boards.forEach(function (x) {
    const g = x.group || "";
    let last = groups[groups.length - 1];
    if (!last || last.name !== g) { last = { name: g, items: [] }; groups.push(last); }
    last.items.push(x);
  });
  return groups.map(function (g) {
    return '<div class="rgroup"><span class="glabel">' + escapeHtml(g.name) + '</span><div class="gchips">' +
      g.items.map(function (x) { return chipBtn("data-rboard", x.id, x.name, RANK.board === x.id, x.desc); }).join("") +
      "</div></div>";
  }).join("");
}

function rankTabs() {
  const c = RANK.cats || {};
  $("rankCats").innerHTML = RANK_CATS.map(function (p) {
    return '<button class="chip' + (RANK.cat === p[0] ? " on" : "") + '" data-rcat="' + p[0] + '">' + p[1] + "</button>";
  }).join("");
  const box = $("rankBoards");
  const info = c[RANK.cat] || {};
  const srcs = info.srcs || [];
  if (!srcs.length) { box.innerHTML = ""; return; }
  const sel = curSel();
  if (!sel.src || !srcs.some(function (x) { return x.id === sel.src; })) sel.src = info.defaultSrc || srcs[0].id;
  let cur = srcs[0];
  srcs.forEach(function (x) { if (x.id === sel.src) cur = x; });
  const dirty = (sel.regions.length || sel.genres.length) && !cur.board;
  const srcRow = '<div class="rgroup"><span class="glabel">来源</span><div class="gchips">' +
    srcs.map(function (x) { return chipBtn("data-fsrc", x.id, x.name, sel.src === x.id, x.tip); }).join("") +
    (dirty ? '<button class="chip sm clr" data-fclear>清空筛选</button>' : "") +
    "</div></div>";
  if (cur.board) {
    sel.regions = []; sel.genres = [];
    const boards = info.boards || [];
    if (!RANK.board || !boards.some(function (x) { return x.id === RANK.board; })) RANK.board = boards.length ? boards[0].id : "";
    box.innerHTML = srcRow + boardsHtml(boards);
    return;
  }
  const rnames = (cur.regions || []).map(function (r) { return typeof r === "string" ? r : r.n; });
  const gnames = cur.genres || [];
  sel.regions = sel.regions.filter(function (x) { return rnames.indexOf(x) >= 0; });
  sel.genres = sel.genres.filter(function (x) { return gnames.indexOf(x) >= 0; });
  box.innerHTML = srcRow +
    (rnames.length ? '<div class="rgroup"><span class="glabel">产地</span><div class="gchips">' +
      rnames.map(function (n) { return chipBtn("data-fregion", n, n, sel.regions.indexOf(n) >= 0); }).join("") + "</div></div>" : "") +
    (gnames.length ? '<div class="rgroup"><span class="glabel">题材</span><div class="gchips">' +
      gnames.map(function (n) { return chipBtn("data-fgenre", n, n, sel.genres.indexOf(n) >= 0); }).join("") + "</div></div>" : "");
}

function rankCard(it) {
  const img = it.cover ? "/api/cover?u=" + encodeURIComponent(it.cover) : "";
  const q = escapeHtml(it.title);
  return '<div class="rcard">' +
    '<div class="rposter" data-rsearch="' + q + '" title="点封面直接搜索网盘资源">' +
      (img ? '<img loading="lazy" src="' + img + '" alt="">' : '<div class="rnoimg">无封面</div>') +
      '<span class="rrank">' + it.rank + "</span>" +
      (it.score ? '<span class="rscore">' + it.score + "</span>" : "") +
    "</div>" +
    '<div class="rtitle" title="' + escapeHtml(it.title + (it.alt ? " / " + it.alt : "")) + '">' + q + "</div>" +
    '<div class="rsub">' + escapeHtml([it.year, it.extra, it.src].filter(Boolean).join(" · ")) + "</div>" +
    '<div class="racts"><button data-rsearch="' + q + '">搜资源</button>' +
      (it.url ? '<a href="' + escapeHtml(it.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(it.urlText || "条目") + "</a>" : "") + '</div>' +
  "</div>";
}

async function loadRank(append) {
  const my = ++RANK.gen;
  if (!append) { RANK.page = 1; RANK.n = 0; $("rankGrid").innerHTML = ""; }
  $("rankInfo").textContent = append ? "加载中..." : "正在抓取（首次可能要十几秒）...";
  try {
    const info = (RANK.cats || {})[RANK.cat] || {};
    const sel = curSel();
    let cur = null;
    (info.srcs || []).forEach(function (x) { if (x.id === sel.src) cur = x; });
    let url;
    if (info.filter && cur && !cur.board) {
      url = "/api/rank?cat=" + encodeURIComponent(RANK.cat) + "&src=" + encodeURIComponent(sel.src) +
        "&regions=" + encodeURIComponent(sel.regions.join(",")) +
        "&genres=" + encodeURIComponent(sel.genres.join(",")) +
        "&page=" + RANK.page + "&limit=24";
    } else {
      url = "/api/rank?cat=" + encodeURIComponent(RANK.cat) +
        (RANK.board ? "&board=" + encodeURIComponent(RANK.board) : "") +
        (info.filter ? "&src=board" : "") +
        "&page=" + RANK.page + "&limit=24";
    }
    const r = await fetch(url).then(function (x) { return x.json(); });
    if (my !== RANK.gen) return;
    if (r.code !== 0) throw new Error(r.error || "抓取失败");
    RANK.hasMore = !!r.hasMore;
    RANK.n += r.items.length;
    $("rankGrid").innerHTML += r.items.map(rankCard).join("") || '<div class="empty">没有匹配结果，试试减少筛选条件。</div>';
    const age = r.cached ? (Math.round(r.ageMs / 60000) + " 分钟前缓存") : "刚刚抓取";
    const via = r.via === "proxy" ? "・经 Clash 代理" : (r.via === "local" ? "・本地离线库" : "・直连");
    let head, tail;
    if (r.src) {
      const f = [];
      if (r.regionNames && r.regionNames.length) f.push("产地 " + r.regionNames.join("+"));
      if (r.genres && r.genres.length) f.push("题材 " + r.genres.join("+"));
      head = escapeHtml(r.srcName) + via + " ・ " + (f.length ? f.join(" ・ ") : "不限");
      tail = " ・ 命中 <b>" + r.filtered + "</b> 条 ・ 第 " + r.page + " 页 ・ " + age;
    } else {
      head = escapeHtml(r.boardName) + via + " ・ 第 " + r.page + " 页 ・ 共 <b>" + (r.total || 0) + "</b> 条 ・ " + age;
      tail = "";
    }
    $("rankInfo").innerHTML = head + tail +
      (r.stale ? ' <span class="bad">（刷新失败，显示旧缓存：' + escapeHtml(r.error || "") + "）</span>" : "");
    $("rankMore").style.display = RANK.hasMore ? "" : "none";
  } catch (e) {
    if (my !== RANK.gen) return;
    $("rankInfo").innerHTML = '<span class="bad">抓取失败：' + escapeHtml(e.message) + "</span>（Bangumi/豆瓣 源需 Clash 代理可用）";
  }
}

async function toggleRank(force) {
  const box = $("rank");
  const show = (force === undefined) ? box.hidden : force;
  box.hidden = !show;
  document.body.classList.toggle("rank-open", show);
  $("rankBtn").textContent = show ? "收起排行榜" : "排行榜";
  if (!show) return;
  await loadRankCats();
  if (!RANK.cats[RANK.cat]) RANK.cat = "anime";
  rankTabs();
  if (!RANK.n) loadRank(false);
}

function shortTitle(t) {
  let s = String(t || "").trim().replace(/[（(][^）)]*[）)]/g, " ");
  const cut = s.split(/[\s·・:：～~—–|]+/).filter(Boolean)[0];
  return (cut || s).trim();
}

async function rankSearch(title) {
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("kw").value = title;
  /* 小说/游戏栏目：默认勾选的「去掉小说/漫画/软件/预告」会把整类结果滤光，这里自动放开 */
  const relax = ["anime", "movie", "tv"].indexOf(RANK.cat) < 0;
  if (relax && $("exPreview").checked) { $("exPreview").checked = false; savePrefs(); }
  const n = await search();
  if (relax) $("meta").innerHTML += '<br><span class="bad">提示</span>：小说/漫画/游戏/音乐栏目已自动放开「去掉小说/漫画/软件/预告」过滤，可手动改回';
  if (n === 0) {
    const s = shortTitle(title);
    if (s && s !== title) { $("kw").value = s; await search(); }
  }
}

$("rankBtn").onclick = function () { toggleRank(); };
$("rankClose").onclick = function () { toggleRank(false); };
$("rankMore").onclick = function () { if (RANK.hasMore) { RANK.page++; loadRank(true); } };
loadPrefs();
loadSrc();
async function rankHash() {
  const h = location.hash || "";
  if (h.indexOf("#rank") !== 0) return false;
  let spec = h.slice(5).replace(/^[=\/:]+/, "");
  try { spec = decodeURIComponent(spec); } catch (e) {}
  await loadRankCats();
  if (spec) {
    const p = spec.split(":");
    if (p[0] && RANK.cats[p[0]]) RANK.cat = p[0];
    if (p[1]) {
      const info = RANK.cats[RANK.cat] || {};
      const known = (info.srcs || []).some(function (x) { return x.id === p[1]; });
      if (known) curSel().src = p[1]; else RANK.board = p[1];
    }
  }
  toggleRank(true);
  return true;
}
rankHash();

/* ===================== 界面交互（筛选面板 / 快捷键） ===================== */
(function () {
  const t = $("optToggle"), box = $("optsBox");
  function open(v) {
    box.hidden = !v;
    t.classList.toggle("on", !!v);
    t.setAttribute("aria-expanded", v ? "true" : "false");
  }
  t.onclick = function (e) { e.stopPropagation(); open(box.hidden); };
  document.addEventListener("click", function (e) {
    const t = e.target.closest && e.target.closest("[data-rankgo]");
    if (!t) return;
    RANK.cat = t.getAttribute("data-rankgo");
    RANK.board = ""; RANK.page = 1; RANK.n = 0;
    toggleRank(true);
  });
  /* 只要有任何一项和默认值不同，就把筛选面板摊开，避免改了还不生效的困惑 */
  const gate = ["onlyLocal", "onlyHeji", "exPreview", "ex4k", "incSd", "incAr", "incAll", "useQuark", "autoCheck", "onlyValid"];
  open(gate.some(function (id) { return $(id).checked !== !!PREFS[id]; }));
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("rank").hidden) { toggleRank(false); return; }
    const tag = ((e.target && e.target.tagName) || "").toLowerCase();
    if (e.key === "/" && tag !== "input" && tag !== "textarea") { e.preventDefault(); $("kw").focus(); }
  });
})();
/* ===================== 深链（?q=）与欢迎空态 ===================== */
(function () {
  const HINTS = [["庆余年", "剧集"], ["双人成行", "游戏"], ["三体", "小说"], ["宫崎骏", "电影"], ["周杰伦", "音乐"]];
  function welcome() {
    if (rows.length) return;
    $("list").innerHTML = '<div class="welcome"><div class="wico">🔍</div>' +
      '<div class="wt">输入片名 / 剧名 / 游戏 / 书名，或直接点下面的例子</div>' +
      '<div class="whints">' + HINTS.map(function (h) {
        return '<button class="hint" data-q="' + h[0] + '">' + h[0] + "<i>" + h[1] + "</i></button>";
      }).join("") + "</div>" +
      '<div class="wt2">\u6ca1\u60f3\u597d\u641c\u4ec0\u4e48\uff1f\u76f4\u63a5\u770b\u699c\u5355 \u2192</div>' +
      '<div class="wgo">' + RANK_CATS.map(function (p) {
        return '<button class="hint" data-rankgo="' + p[0] + '">' + p[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="wkeys"><kbd>/</kbd> 聚焦搜索框 ・ <kbd>Esc</kbd> 关掉榜单浮层 ・ 结果里点「复制链接 / 打开并转存」</div></div>';
  }
  document.addEventListener("click", function (e) {
    const t = e.target.closest && e.target.closest("[data-q]");
    if (t) { $("kw").value = t.getAttribute("data-q"); search(); }
  });
  $("clear").addEventListener("click", function () { setTimeout(welcome, 0); });
  const q0 = new URLSearchParams(location.search).get("q");
  if (q0) { $("kw").value = q0; search(); } else welcome();
})();
/* ===================== 榜单状态同步到地址栏 ===================== */
(function () {
  function sync() {
    const on = !$("rank").hidden;
    const h = on ? "#rank=" + RANK.cat + (RANK.board ? ":" + RANK.board : "") : "";
    if (location.hash !== h) { try { history.replaceState(null, "", location.pathname + location.search + h); } catch (e) {} }
  }
  document.addEventListener("click", function (e) {
    const t = e.target;
    if (t.closest && t.closest("[data-rcat],[data-rboard],[data-fsrc]")) setTimeout(sync, 0);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setTimeout(sync, 0); });
  ["rankBtn", "rankClose"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { setTimeout(sync, 0); }); });
})();
</script>
